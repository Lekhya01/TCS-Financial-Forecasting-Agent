services:
  mysql:
    image: mysql:8.0
    container_name: tcs-forecast-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcs_forecast
      MYSQL_USER: tcs_user
      MYSQL_PASSWORD: tcs_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
